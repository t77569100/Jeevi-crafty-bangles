<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Jeevi Crafty Bangles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #C76B85;          /* Dusty Rose */
      --bg-cream: #FFF8F0;         /* Cream */
      --accent-gold: #D4AF37;      /* Gold */
      --text-dark: #3B2A24;        /* Dark Brown */
      --btn-rose: #B84F70;         /* Rose Pink */
      --card-pink: #FCE8EF;        /* Soft Pink */
      --white: #FFFFFF;            /* White */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      padding: 16px;
      padding-bottom: 70px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--card-pink);
    }

    header a {
      color: var(--text-dark);
      font-size: 1.2rem;
      text-decoration: none;
    }

    header h2 {
      font-size: 1.2rem;
      color: var(--primary);
    }

    .order-card {
      background: var(--white);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--card-pink);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #eeddd7;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .order-id {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-placed { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d1ecf1; color: #0c5460; }
    .status-packed { background: #e2e3e5; color: #383d41; }
    .status-shipped { background: #cce5ff; color: #004085; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 6px;
    }

    .item-info {
      flex: 1;
      font-size: 0.85rem;
    }

    .order-footer {
      border-top: 1px solid #eeddd7;
      padding-top: 8px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .order-total {
      font-weight: bold;
      color: var(--btn-rose);
      font-size: 0.95rem;
    }

    .no-orders {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>My Orders</h2>
  </header>

  <div id="ordersContainer">ஆர்டர்கள் ஏற்றப்படுகின்றன...</div>

  <script type="module">
    import { auth, db, collection, query, where, getDocs, onAuthStateChanged } from "./js/firebase-config.js";

    const container = document.getElementById("ordersContainer");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("ஆர்டர்களைப் பார்க்க முதலில் Login செய்யவும்!");
        window.location.href = "login.html";
        return;
      }

      try {
        // தற்போதைய பயனரின் ஆர்டர்களை மட்டும் எடுத்தல்
        const q = query(collection(db, "orders"), where("userId", "==", user.uid));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          container.innerHTML = `
            <div class="no-orders">
              <i class="fa-solid fa-box-open" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 10px;"></i>
              <p>நீங்கள் இன்னும் எந்த ஆர்டரும் செய்யவில்லை.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = "";

        querySnapshot.forEach((docSnap) => {
          const order = docSnap.data();
          const orderId = docSnap.id;
          const statusClass = `status-${(order.orderStatus || 'placed').toLowerCase()}`;

          let itemsHtml = "";
          order.items.forEach(item => {
            itemsHtml += `
              <div class="item-row">
                <img src="${item.img}" class="item-img" alt="${item.name}" onerror="this.src='https://via.placeholder.com/45'">
                <div class="item-info">
                  <div><strong>${item.name}</strong></div>
                  <div style="color: #666;">அளவு: ${item.quantity} | ₹${item.price}</div>
                </div>
              </div>
            `;
          });

          const card = document.createElement("div");
          card.className = "order-card";
          card.innerHTML = `
            <div class="order-header">
              <span class="order-id">Order ID: #${orderId.substring(0, 6)}</span>
              <span class="status-badge ${statusClass}">${order.orderStatus}</span>
            </div>
            ${itemsHtml}
            <div class="order-footer">
              <span>Payment: ${order.paymentMethod}</span>
              <span class="order-total">Total: ₹${order.totalAmount}</span>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<p style="color: red; text-align: center;">பிழை: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
