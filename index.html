<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Jeevi Crafty Bangles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #C76B85;
      --bg-cream: #FFF8F0;
      --accent-gold: #D4AF37;
      --text-dark: #3B2A24;
      --btn-rose: #B84F70;
      --card-pink: #FCE8EF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: var(--white);
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-pink);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dcccd0;
      border-radius: 8px;
      background: var(--bg-cream);
      font-size: 0.95rem;
      outline: none;
    }

    .auth-btn {
      width: 100%;
      background: var(--btn-rose);
      color: var(--white);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .toggle-text {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
    }

    .toggle-text a {
      color: var(--btn-rose);
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .msg-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .error { background: #ffe6e6; color: #d63031; }
    .success { background: #e6ffed; color: #27ae60; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2 id="formTitle">உள்நுழைக (Login)</h2>

    <form id="authForm">
      <div class="form-group">
        <label>மின்னஞ்சல் (Email)</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label>கடவுச்சொல் (Password)</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">Login</button>
    </form>

    <div id="feedback" class="msg-box"></div>

    <div class="toggle-text">
      <span id="toggleMsg">கணக்கு இல்லையா?</span> 
      <a id="toggleLink">Sign Up</a>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword 
    } from "./js/firebase-config.js";

    const ADMIN_EMAIL = "tharuntharu7489@gmail.com";
    let isLoginMode = true;

    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const toggleMsg = document.getElementById("toggleMsg");
    const toggleLink = document.getElementById("toggleLink");
    const feedback = document.getElementById("feedback");

    toggleLink.onclick = () => {
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        formTitle.innerText = "உள்நுழைக (Login)";
        submitBtn.innerText = "Login";
        toggleMsg.innerText = "கணக்கு இல்லையா?";
        toggleLink.innerText = "Sign Up";
      } else {
        formTitle.innerText = "புதிய கணக்கு (Sign Up)";
        submitBtn.innerText = "Sign Up";
        toggleMsg.innerText = "ஏற்கனவே கணக்கு உள்ளதா?";
        toggleLink.innerText = "Login";
      }
    };

    document.getElementById("authForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.innerText = "செயல்படுகிறது...";

      try {
        if (isLoginMode) {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          showMsg("வெற்றிகரமாக உள்நுழைந்துவிட்டீர்கள்!", "success");

          setTimeout(() => {
            if (user.email === ADMIN_EMAIL) {
              window.location.href = "admin/index.html"; // Admin எனில் Admin Dashboard செல்லும்
            } else {
              window.location.href = "index.html"; // மற்றவர்கள் எனில் முகப்புப் பக்கம் செல்லும்
            }
          }, 1000);

        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          showMsg("கணக்கு உருவாக்கப்பட்டது! உள்நுழையலாம்.", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        }
      } catch (err) {
        showMsg("பிழை: " + err.message, "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isLoginMode ? "Login" : "Sign Up";
      }
    };

    function showMsg(text, type) {
      feedback.innerText = text;
      feedback.className = `msg-box ${type}`;
      feedback.style.display = "block";
      setTimeout(() => feedback.style.display = "none", 3500);
    }
  </script>
</body>
</html>
